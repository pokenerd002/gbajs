<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon GBA | Game Center</title>

<style>
:root {
  --bg: #090914;
  --panel: #121225;
  --panel2: #191932;
  --purple: #a855f7;
  --blue: #38bdf8;
  --text: #f4f2ff;
  --muted: #9999b8;
  --border: rgba(168,85,247,.25);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow-x: hidden;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at top left, #241044 0, transparent 45%),
    radial-gradient(ellipse at top right, #10213e 0, transparent 45%),
    var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

header {
  padding: 22px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  border-bottom: 1px solid var(--border);
  background: rgba(9,9,20,.8);
}

.logo {
  font-size: 23px;
  font-weight: 900;
  letter-spacing: 2px;
}

.logo span {
  color: var(--purple);
}

.header-status {
  color: var(--blue);
  font-size: 12px;
  letter-spacing: 1px;
}

.container {
  width: min(1200px, 94%);
  margin: 30px auto;
}

.section-title {
  font-size: 19px;
  margin: 0 0 16px;
}

.panel {
  background: rgba(18,18,37,.94);
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 20px;
  box-shadow: 0 8px 35px rgba(0,0,0,.25);
}

.main-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 280px;
  gap: 20px;
  align-items: start;
}

.game-panel {
  min-width: 0;
}

.game-stage {
  width: 100%;
  min-height: clamp(340px, 45vw, 560px);
  padding: clamp(14px, 2vw, 25px);
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(ellipse, #252044 0%, #111121 65%, #090914 100%);
  border-radius: 13px;
  overflow: hidden;
  position: relative;
}

#gameFrame {
  width: min(720px, 100%);
  flex: 0 1 auto;
  margin: auto;
  padding: 10px;
  border-radius: 13px;
  background: linear-gradient(135deg, #34304c, #151526);
  border: 2px solid #554078;
  box-shadow:
    0 0 12px rgba(168,85,247,.5),
    0 0 35px rgba(56,189,248,.15);
}

#gameScaler {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  background: #000;
}

#gameWrap {
  position: absolute;
  left: 0;
  top: 0;
  width: 240px;
  height: 160px;
  transform-origin: top left;
}

#screen {
  display: block;
  width: 240px !important;
  height: 160px !important;
  max-width: none !important;
  background: #000;
  image-rendering: pixelated;
}

/* Fullscreen centers the 3:2 game frame in the full browser viewport. */
#gameStage:fullscreen,
#gameStage:-webkit-full-screen {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  min-height: 0;
  max-height: 100vh;
  padding: 16px;
  margin: 0;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  border-radius: 0;
  box-sizing: border-box;
}

#gameStage:fullscreen #gameFrame,
#gameStage:-webkit-full-screen #gameFrame {
  width: min(1100px, calc(100vw - 32px), calc((100vh - 56px) * 1.5));
  padding: 8px;
  flex: 0 1 auto;
  margin: auto;
  border-radius: 12px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 17px;
}

.btn {
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 11px 15px;
  color: white;
  background: var(--panel2);
  transition: .2s;
}

.btn:hover {
  border-color: var(--blue);
  box-shadow: 0 0 12px rgba(56,189,248,.25);
  transform: translateY(-1px);
}

.btn-primary {
  background: linear-gradient(110deg, #8134d5, #455be9);
  border: none;
}

.btn-blue {
  background: linear-gradient(110deg, #1768a8, #3449c5);
  border: none;
}

.btn-danger {
  background: #48202e;
  border-color: #a04465;
}

.btn-purple {
  background: #301b50;
  border-color: #7742ad;
}

.status {
  color: var(--muted);
  font-size: 13px;
  min-height: 20px;
  margin-top: 13px;
  overflow-wrap: anywhere;
}

.sidebar {
  display: flex;
  flex-direction: column;
  gap: 17px;
}

.library-list {
  display: flex;
  flex-direction: column;
  gap: 9px;
  max-height: 300px;
  overflow-y: auto;
}

.library-item {
  width: 100%;
  text-align: left;
  background: #1a1931;
  border: 1px solid var(--border);
  color: white;
  border-radius: 9px;
  padding: 12px;
  overflow-wrap: anywhere;
}

.library-item:hover {
  border-color: var(--blue);
  background: #242044;
}

.library-item.active {
  border-color: var(--purple);
  box-shadow: 0 0 12px rgba(168,85,247,.2);
}

.library-item small {
  display: block;
  color: var(--muted);
  margin-top: 5px;
}

.empty {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}

.file-input {
  display: none;
}

.file-label {
  display: block;
  text-align: center;
  width: 100%;
  margin-top: 12px;
}

.tool-group {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.tool-group .btn {
  width: 100%;
  text-align: center;
}

.info-label {
  color: var(--muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.game-name {
  font-size: 17px;
  font-weight: bold;
  margin-top: 7px;
  overflow-wrap: anywhere;
}

footer {
  text-align: center;
  padding: 25px;
  color: var(--muted);
  font-size: 12px;
}

@media(max-width: 800px) {
  .main-layout {
    grid-template-columns: 1fr;
  }

  .sidebar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  }

  header {
    padding: 17px 4%;
  }
}

@media(max-width: 480px) {
  .controls {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
  }

  .controls .btn {
    width: 100%;
  }

  .panel {
    padding: 13px;
  }

  .game-stage {
    min-height: 240px;
    padding: 12px 8px;
  }

  #gameFrame {
    width: 100%;
  }

  .logo {
    font-size: 18px;
  }
}
</style>

<!-- Emulator scripts -->
<script>
window.__errors = [];

window.addEventListener("error", function(e) {
  var text = e.target && e.target.src
    ? "Failed to load: " + e.target.src
    : "Error: " + e.message + " (line " + e.lineno + ")";

  window.__errors.push(text);

  var box = document.getElementById("err");
  if (box) box.textContent = window.__errors.join("\n");
}, true);
</script>

<script src="resources/xhr.js"></script>
<script src="js/util.js"></script>
<script src="js/core.js"></script>
<script src="js/arm.js"></script>
<script src="js/thumb.js"></script>
<script src="js/mmu.js"></script>
<script src="js/io.js"></script>
<script src="js/audio.js"></script>
<script src="js/video.js"></script>
<script src="js/video/proxy.js"></script>
<script src="js/video/software.js"></script>
<script src="js/irq.js"></script>
<script src="js/keypad.js"></script>
<script src="js/sio.js"></script>
<script src="js/savedata.js"></script>
<script src="js/gpio.js"></script>
<script src="js/gba.js"></script>

</head>

<body>

<header>
  <div class="logo">NEON <span>GBA</span></div>
  <div class="header-status">● EMULATOR CENTER</div>
</header>

<main class="container">

  <div class="main-layout">

    <!-- GAME SCREEN -->

    <section class="panel game-panel">

      <h2 class="section-title">Your Game</h2>

      <div class="game-stage" id="gameStage">
        <div id="gameFrame">
          <div id="gameScaler">
            <div id="gameWrap">
              <canvas id="screen" width="240" height="160"></canvas>
            </div>
          </div>
        </div>
      </div>

      <div class="controls">

        <button class="btn btn-primary" id="fullscreenBtn">
          ⛶ Fullscreen
        </button>

        <button class="btn btn-blue" id="resetBtn">
          ↻ Reset
        </button>

        <button class="btn btn-purple" id="speedBtn">
          ⚡ Speed: 1x
        </button>

      </div>

      <div class="status" id="msg">
        Loading BIOS...
      </div>

      <div id="err" class="status" style="color:#ff8080"></div>

    </section>

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <!-- GAME LIBRARY -->

      <section class="panel">

        <h2 class="section-title">🎮 Game Library</h2>

        <div class="library-list" id="libraryList">
          <div class="empty">
            Your library is empty.<br>
            Add a GBA game to get started.
          </div>
        </div>

        <label class="btn btn-primary file-label" for="rom">
          + Add Game
        </label>

        <input
          type="file"
          id="rom"
          class="file-input"
          accept=".gba,.bin"
        >

      </section>

      <!-- GAME INFORMATION -->

      <section class="panel">

        <div class="info-label">Currently Playing</div>

        <div class="game-name" id="gameName">
          No game loaded
        </div>

        <div class="status">
          Game Boy Advance Emulator
        </div>

      </section>

      <!-- SAVE MANAGEMENT -->

      <section class="panel">

        <h2 class="section-title">💾 Save Management</h2>

        <div class="tool-group">

          <label class="btn file-label" for="importSave">
            ↑ Import Save
          </label>

          <input
            type="file"
            id="importSave"
            class="file-input"
            accept=".sav,.sa1,.bin"
          >

          <button class="btn btn-blue" id="exportBtn">
            ↓ Export Save
          </button>

        </div>

        <div class="status" id="saveMsg">
          Import or export your game saves.
        </div>

      </section>

    </aside>

  </div>

</main>

<footer>
  NEON GBA · Game Boy Advance Emulator
</footer>

<script>
(function() {

  var msg = document.getElementById("msg");
  var errBox = document.getElementById("err");
  var canvas = document.getElementById("screen");
  var stage = document.getElementById("gameStage");
  var scaler = document.getElementById("gameScaler");
  var wrap = document.getElementById("gameWrap");
  var romInput = document.getElementById("rom");

  var libraryList = document.getElementById("libraryList");
  var gameName = document.getElementById("gameName");
  var saveMsg = document.getElementById("saveMsg");

  var emu = null;
  var currentFile = null;
  var running = false;
  var speed = 1;
  var biosReady = false;

  // Session game library
  var games = [];

  if (window.__errors.length) {
    errBox.textContent = window.__errors.join("\n");
  }

  // SCREEN SCALING

  function fit() {
    var w = scaler.clientWidth;
    if (!w) return;
    wrap.style.transform = "scale(" + (w / 240) + ")";
  }

  fit();

  window.addEventListener("resize", fit);

  document.addEventListener("fullscreenchange", function() {
    fit();
    setTimeout(fit, 100);
  });

  if (window.ResizeObserver) {
    new ResizeObserver(fit).observe(scaler);
  }

  // AUDIO UNLOCK

  function resumeAudio() {
    try {
      if (
        emu &&
        emu.audio &&
        emu.audio.context &&
        emu.audio.context.state === "suspended"
      ) {
        emu.audio.context.resume();
      }
    } catch (err) {}
  }

  ["click", "touchstart", "keydown"].forEach(function(ev) {
    document.addEventListener(ev, resumeAudio);
  });

  // FULLSCREEN

  var fullscreenBtn = document.getElementById("fullscreenBtn");

  fullscreenBtn.addEventListener("click", function() {

    if (!document.fullscreenElement) {

      if (stage.requestFullscreen) {
        stage.requestFullscreen().catch(function(err) {
          msg.textContent = "Fullscreen error: " + err.message;
        });
      } else {
        msg.textContent = "Fullscreen is not supported by this browser.";
      }

    } else {

      document.exitFullscreen();

    }

  });

  document.addEventListener("fullscreenchange", function() {

    fullscreenBtn.textContent =
      document.fullscreenElement === stage
        ? "✕ Exit Fullscreen"
        : "⛶ Fullscreen";

  });

  // START EMULATOR

  try {

    emu = new GameBoyAdvance();

    emu.logLevel = emu.LOG_ERROR;

    emu.setCanvas(canvas);

    emu.keypad.KEYCODE_SELECT = 16;

  } catch(err) {

    msg.textContent = "Emulator failed to start: " + err.message;
    return;

  }

  // LOAD BIOS

  fetch("resources/bios.bin")

    .then(function(r) {

      if (!r.ok) {
        throw new Error("bios.bin not found");
      }

      return r.arrayBuffer();

    })

    .then(function(buf) {

      emu.setBios(buf);

      biosReady = true;

      msg.textContent = "BIOS loaded. Add a GBA game to begin.";

    })

    .catch(function(err) {

      msg.textContent = "BIOS error: " + err.message;

    });

  // GAME LIBRARY

  function renderLibrary() {

    libraryList.innerHTML = "";

    if (games.length === 0) {

      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Your library is empty. Add a GBA game to get started.";

      libraryList.appendChild(empty);
      return;

    }

    games.forEach(function(file) {

      var item = document.createElement("button");

      item.className = "library-item";

      if (currentFile === file) {
        item.classList.add("active");
      }

      var title = document.createElement("strong");
      title.textContent = file.name;

      var subtitle = document.createElement("small");
      subtitle.textContent =
        (file.size / 1024).toFixed(1) + " KB · GBA ROM";

      item.appendChild(title);
      item.appendChild(subtitle);

      item.addEventListener("click", function() {
        startRom(file);
      });

      libraryList.appendChild(item);

    });

  }

  // LOAD ROM

  function startRom(file) {

    if (!biosReady) {
      msg.textContent = "Please wait for the BIOS to finish loading.";
      return;
    }

    running = false;

    resumeAudio();

    try {
      emu.pause();
    } catch(err) {}

    try {
      emu.reset();
    } catch(err) {}

    msg.textContent = "Loading " + file.name + "...";

    emu.loadRomFromFile(file, function(ok) {

      if (ok) {

        currentFile = file;

        emu.runStable();

        running = true;

        resumeAudio();

        gameName.textContent = file.name;

        msg.textContent = "Playing: " + file.name;

        renderLibrary();

      } else {

        msg.textContent = "Could not load that ROM.";

      }

    });

  }

  romInput.addEventListener("change", function(e) {

    var file = e.target.files[0];

    if (!file) return;

    var alreadyAdded = games.some(function(existing) {
      return existing.name === file.name &&
        existing.size === file.size;
    });

    if (!alreadyAdded) {
      games.push(file);
    }

    renderLibrary();

    startRom(file);

    // Allow selecting the same file again
    romInput.value = "";

  });

  // IMPORT SAVE

  document.getElementById("importSave")
    .addEventListener("change", function(e) {

      var file = e.target.files[0];

      if (!file) return;

      if (!emu.loadSavedataFromFile) {

        saveMsg.textContent = "This build can't import saves.";

        return;

      }

      try {

        emu.loadSavedataFromFile(file);

        saveMsg.textContent = "Save imported: " + file.name;

      } catch(err) {

        saveMsg.textContent = "Save import failed: " + err.message;

      }

      e.target.value = "";

    });

  // EXPORT SAVE
  // Uses the emulator's built-in save-data exporter.

  document.getElementById("exportBtn")
    .addEventListener("click", function() {

      if (!emu.downloadSavedata) {

        saveMsg.textContent = "This build can't export saves.";

        return;

      }

      try {

        emu.downloadSavedata();

        saveMsg.textContent =
          "Save export requested. Check your Downloads folder.";

      } catch(err) {

        saveMsg.textContent =
          "Save export failed: " + err.message;

      }

    });

  // RESET GAME

  document.getElementById("resetBtn")
    .addEventListener("click", function() {

      if (currentFile) {

        startRom(currentFile);

      } else {

        msg.textContent = "Load a game first.";

      }

    });

  // SPEED CONTROL

  setInterval(function() {

    if (speed > 1 && running && !emu.paused) {

      try {

        for (var i = 1; i < speed; i++) {
          emu.advanceFrame();
        }

      } catch(err) {}

    }

  }, 16);

  document.getElementById("speedBtn")
    .addEventListener("click", function() {

      speed = speed >= 4 ? 1 : speed + 1;

      this.textContent = "⚡ Speed: " + speed + "x";

      this.blur();

    });

})();
</script>

</body>
</html>
