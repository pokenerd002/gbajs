<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GBA Emulator</title>
  <style>
    body { margin:0; background:#111; color:#eee; font-family:sans-serif; text-align:center; }
    #bar { padding:12px; }
    #holder { width:100%; }
    #wrap { width:240px; height:160px; margin:0 auto; transform-origin:top center; }
    canvas { width:240px; height:160px; display:block; image-rendering:pixelated; background:#000; }
    #msg { font-size:14px; opacity:.7; padding:6px; }
    #err { color:#ff8080; font-size:13px; padding:6px; white-space:pre-wrap; }
  </style>

  <script>
    // Shows any script error or missing file on the page itself
    window.__errors = [];
    window.addEventListener("error", function (e) {
      var text = e.target && e.target.src
        ? "Failed to load: " + e.target.src
        : "Error: " + e.message + " (line " + e.lineno + ")";
      window.__errors.push(text);
      var box = document.getElementById("err");
      if (box) box.textContent = window.__errors.join("\n");
    }, true);
  </script>

  <script src="resources/xhr.js"></script>
  <script src="js/util.js"></script>
  <script src="js/core.js"></script>
  <script src="js/arm.js"></script>
  <script src="js/thumb.js"></script>
  <script src="js/mmu.js"></script>
  <script src="js/io.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/video.js"></script>
  <script src="js/video/proxy.js"></script>
  <script src="js/video/software.js"></script>
  <script src="js/irq.js"></script>
  <script src="js/keypad.js"></script>
  <script src="js/sio.js"></script>
  <script src="js/savedata.js"></script>
  <script src="js/gpio.js"></script>
  <script src="js/gba.js"></script>
</head>
<body>
  <div id="bar">
    <input type="file" id="rom" accept=".gba,.bin">
    <div id="msg">Loading BIOS...</div>
    <div id="err"></div>
  </div>
  <div id="holder"><div id="wrap">
    <canvas id="screen" width="240" height="160"></canvas>
  </div></div>

  <script>
  (function () {
    var msg = document.getElementById("msg");
    var errBox = document.getElementById("err");
    var canvas = document.getElementById("screen");
    var wrap = document.getElementById("wrap");
    var holder = document.getElementById("holder");
    var romInput = document.getElementById("rom");
    var emu = null;

    if (window.__errors.length) errBox.textContent = window.__errors.join("\n");

    // Screen scaling
    function fit() {
      var s = Math.min(window.innerWidth / 240, 3);
      wrap.style.transform = "scale(" + s + ")";
      holder.style.height = (160 * s) + "px";
    }
    fit();
    window.addEventListener("resize", fit);

    // Audio unlock
    function resumeAudio() {
      try {
        if (emu && emu.audio && emu.audio.context && emu.audio.context.state === "suspended") {
          emu.audio.context.resume();
        }
      } catch (err) {}
    }
    ["click", "touchstart", "keydown"].forEach(function (ev) {
      document.addEventListener(ev, resumeAudio);
    });

    // Start emulator
    try {
      emu = new GameBoyAdvance();
      emu.logLevel = emu.LOG_ERROR;
      emu.setCanvas(canvas);
    } catch (err) {
      msg.textContent = "Emulator failed to start: " + err.message;
      return;
    }

    // Load BIOS
    fetch("resources/bios.bin")
      .then(function (r) {
        if (!r.ok) throw new Error("bios.bin not found");
        return r.arrayBuffer();
      })
      .then(function (buf) {
        emu.setBios(buf);
        msg.textContent = "Pick a .gba file to play. Keys: arrows, Z=B, X=A, A=L, S=R, Enter=Start, Backspace=Select";
      })
      .catch(function (err) {
        msg.textContent = "BIOS error: " + err.message;
      });

    // Load ROM
    romInput.addEventListener("change", function (e) {
      var file = e.target.files[0];
      if (!file) return;
      resumeAudio();
      emu.reset();
      emu.loadRomFromFile(file, function (ok) {
        if (ok) {
          emu.runStable();
          resumeAudio();
          msg.textContent = "Playing: " + file.name;
        } else {
          msg.textContent = "Could not load that ROM.";
        }
      });
    });
  })();
  </script>
</body>
</html>
